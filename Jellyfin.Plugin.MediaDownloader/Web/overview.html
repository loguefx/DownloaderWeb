<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Media Downloader</title>
    <style>
        .md-section { margin-bottom: 1.8em; }
        .md-card {
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: .6em;
            padding: 1.2em 1.4em;
            margin-bottom: 1em;
        }
        .md-card h3 { margin: 0 0 .6em 0; font-size: 1.1em; font-weight: 600; }
        .md-search-row { display: flex; gap: .6em; align-items: center; flex-wrap: wrap; }
        .md-search-row input[type=text] { flex: 1; min-width: 220px; }
        .md-results { margin-top: .8em; }
        .md-results table { width: 100%; border-collapse: collapse; }
        .md-results td { padding: .5em .6em; border-bottom: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
        .md-results tr:hover { background: rgba(255,255,255,.04); cursor: pointer; }
        .md-results .md-select-btn {
            background: #2196f3; color: #fff; border: none; border-radius: .3em;
            padding: .35em .9em; cursor: pointer; font-size: .9em; font-weight: 500;
        }
        .md-results .md-select-btn:hover { background: #1976d2; }
        .md-selected {
            display: flex; gap: 1em; align-items: flex-start; margin-top: 1em;
            padding: 1em; background: rgba(33,150,243,.08); border-radius: .5em;
            border: 1px solid rgba(33,150,243,.2);
        }
        .md-selected img { width: 64px; border-radius: .3em; }
        .md-selected .md-info { flex: 1; }
        .md-selected .md-info strong { font-size: 1.05em; }
        .md-selected .md-info span { color: #999; font-size: .9em; }
        .md-actions { display: flex; gap: .6em; align-items: center; margin-top: .8em; flex-wrap: wrap; }
        .md-btn {
            background: #2196f3; color: #fff; border: none; border-radius: .35em;
            padding: .55em 1.4em; cursor: pointer; font-size: .95em; font-weight: 500;
        }
        .md-btn:hover { background: #1976d2; }
        .md-btn:disabled { opacity: .5; cursor: not-allowed; }
        .md-btn-secondary { background: rgba(255,255,255,.1); }
        .md-btn-secondary:hover { background: rgba(255,255,255,.18); }
        .md-msg { font-size: .9em; margin-top: .4em; }
        .md-msg.ok { color: #4caf50; }
        .md-msg.err { color: #ef5350; }
        .md-msg.wait { color: #ff9800; }
        .md-queue-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: .5em; margin-top: .6em;
        }
        .md-queue-item { text-align: center; padding: .6em .3em; background: rgba(255,255,255,.04); border-radius: .4em; }
        .md-queue-item .md-q-num { font-size: 1.4em; font-weight: 700; }
        .md-queue-item .md-q-label { font-size: .75em; color: #999; margin-top: .2em; }
        .md-warning {
            padding: .7em 1em; border-radius: .4em; margin-bottom: .8em;
            background: rgba(255,152,0,.1); border: 1px solid rgba(255,152,0,.3); color: #ffb74d; font-size: .9em;
        }
        .md-outbox-row { display: flex; justify-content: space-between; align-items: center; padding: .4em 0; border-bottom: 1px solid rgba(255,255,255,.05); }
        .md-outbox-row .md-state-wait { color: #ff9800; }
        .md-outbox-row .md-state-sent { color: #4caf50; }
        .md-outbox-row .md-state-rej { color: #ef5350; }
        .md-outbox-row button { background: none; border: 1px solid rgba(255,255,255,.2); color: #ccc; border-radius: .3em; padding: .2em .6em; cursor: pointer; font-size: .8em; }
        .md-outbox-row button:hover { border-color: #ef5350; color: #ef5350; }
    </style>
</head>
<body>
    <div id="overviewPage" data-role="page" class="page type-interior pluginPage"
         data-require="emby-button,emby-select">
        <div data-role="content">
            <div class="content-primary">
                <!-- Banner -->
                <div id="banner" style="padding:.8em 1em;border-radius:.5em;margin-bottom:1.2em;font-weight:600;"></div>

                <!-- ====== SEARCH & DOWNLOAD ====== -->
                <div class="md-section">
                    <div class="md-card">
                        <h3>Search &amp; Download</h3>
                        <div id="libWarning" class="md-warning" style="display:none;">
                            ⚠ No target library is configured. Set a default in <strong>Media Downloader → Settings</strong>, or pick one below before queuing.
                        </div>
                        <div class="md-search-row">
                            <input id="searchInput" type="text" class="emby-input" placeholder="Type a title… (e.g. Breaking Bad, Dune, One Piece)" autocomplete="off" />
                            <select id="searchType" class="emby-select" style="min-width:110px;">
                                <option value="all">All</option>
                                <option value="tv">TV / Anime</option>
                                <option value="movie">Movies</option>
                            </select>
                            <select id="jobLibrary" class="emby-select" style="min-width:150px;">
                                <option value="">Library…</option>
                            </select>
                        </div>

                        <!-- Results dropdown -->
                        <div id="searchResults" class="md-results" style="display:none;"></div>

                        <!-- Selected item -->
                        <div id="selectedPanel" class="md-selected" style="display:none;">
                            <img id="selPoster" style="display:none;" />
                            <div class="md-info">
                                <strong id="selTitle"></strong><br/>
                                <span id="selMeta"></span>
                            </div>
                            <div style="min-width:180px;">
                                <div id="selSeasonRow" style="display:none;margin-bottom:.5em;">
                                    <select id="selSeason" class="emby-select" style="width:100%;margin-bottom:.4em;"></select>
                                    <select id="selEpisode" class="emby-select" style="width:100%;"></select>
                                </div>
                            </div>
                        </div>

                        <div class="md-actions">
                            <button id="queueBtn" class="md-btn" type="button" disabled>Queue Download</button>
                            <span id="queueMsg" class="md-msg"></span>
                        </div>
                    </div>
                </div>

                <!-- ====== ENGINE QUEUE ====== -->
                <div class="md-section">
                    <div class="md-card">
                        <h3>Engine Queue</h3>
                        <div class="md-actions" style="margin-top:0;margin-bottom:.6em;">
                            <button id="refreshBtn" class="md-btn md-btn-secondary" type="button">↻ Refresh</button>
                            <button id="pauseBtn" class="md-btn md-btn-secondary" type="button">Pause</button>
                            <button id="resumeBtn" class="md-btn md-btn-secondary" type="button">Resume</button>
                            <button id="stopBtn" class="md-btn md-btn-secondary" type="button">Stop All</button>
                        </div>
                        <div id="queueGrid" class="md-queue-grid"></div>
                    </div>
                </div>

                <!-- ====== OUTBOX ====== -->
                <div class="md-section">
                    <div class="md-card">
                        <h3>Outbox <span style="font-weight:400;font-size:.85em;color:#999;">(delivered when engine is back)</span></h3>
                        <div id="outboxList" style="margin-top:.5em;"></div>
                        <div class="md-actions">
                            <button id="purgeSentBtn" class="md-btn md-btn-secondary" type="button">Clear delivered</button>
                            <button id="purgeRejectedBtn" class="md-btn md-btn-secondary" type="button">Clear rejected</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script type="text/javascript">
            (() => {
                const $ = (s) => document.querySelector(s);

                // --- API helpers ---
                function apiGet(path) {
                    return ApiClient.ajax({ type: 'GET', url: ApiClient.getUrl(path), dataType: 'json' });
                }
                function apiPost(path, data) {
                    return ApiClient.ajax({
                        type: 'POST', url: ApiClient.getUrl(path),
                        data: JSON.stringify(data || {}),
                        contentType: 'application/json',
                        dataType: 'json'
                    });
                }
                function apiDelete(path) {
                    return ApiClient.ajax({ type: 'DELETE', url: ApiClient.getUrl(path), dataType: 'json' });
                }

                // Extract error message from various rejection shapes
                function errMsg(err) {
                    if (!err) return 'Unknown error';
                    if (typeof err === 'string') return err;
                    if (err.message) return err.message;
                    if (err.error) return err.error;
                    // Jellyfin ApiClient sometimes rejects with the Response object
                    if (err.status) return 'HTTP ' + err.status + (err.statusText ? ' ' + err.statusText : '');
                    return String(err);
                }

                // --- Banner ---
                function setBanner(ok, text) {
                    const b = $('#banner');
                    b.textContent = text;
                    if (ok) { b.style.background = '#e8f5e9'; b.style.color = '#1b5e20'; b.style.borderLeft = '5px solid #2e7d32'; }
                    else { b.style.background = '#fff3e0'; b.style.color = '#e65100'; b.style.borderLeft = '5px solid #ff9800'; }
                }

                // --- Queue display ---
                function renderQueue(q) {
                    const grid = $('#queueGrid');
                    if (!q) { grid.innerHTML = ''; return; }
                    const items = [
                        ['queued', q.queued], ['downloading', q.downloading], ['verifying', q.verifying],
                        ['placing', q.placing], ['waiting', q.waiting], ['failed', q.failed], ['done', q.done]
                    ];
                    grid.innerHTML = items.map(function(p) {
                        return '<div class="md-queue-item"><div class="md-q-num">' + (p[1] != null ? p[1] : '-') + '</div><div class="md-q-label">' + p[0] + '</div></div>';
                    }).join('');
                }

                // --- Outbox display ---
                function renderOutbox(items) {
                    const box = $('#outboxList');
                    if (!items || !items.length) {
                        box.innerHTML = '<div style="color:#888;padding:.5em 0;font-size:.9em;">Empty - nothing waiting.</div>';
                        return;
                    }
                    box.innerHTML = items.map(function(e, i) {
                        const cls = e.state === 'waiting-to-send' ? 'md-state-wait' : e.state === 'sent' ? 'md-state-sent' : 'md-state-rej';
                        const time = e.createdAt ? new Date(e.createdAt).toLocaleString() : '';
                        return '<div class="md-outbox-row">' +
                            '<span>' + (e.title || e.jobId) + '</span>' +
                            '<span class="' + cls + '" style="font-size:.85em;">' + e.state + '</span>' +
                            '<span style="font-size:.8em;color:#888;">' + time + '</span>' +
                            '<button data-idx="' + i + '">Remove</button>' +
                            '</div>';
                    }).join('');
                    box.querySelectorAll('button[data-idx]').forEach(function(btn) {
                        btn.addEventListener('click', function() {
                            const item = items[parseInt(btn.getAttribute('data-idx'))];
                            apiDelete('MediaDownloader/Outbox/' + encodeURIComponent(item.jobId)).then(refresh).catch(function() {});
                        });
                    });
                }

                function refresh() {
                    return apiGet('MediaDownloader/Health').then((h) => {
                        const out = h.outbox || {};
                        if (h.engine === 'online') {
                            const vpn = (h.health && h.health.vpn) || {};
                            const q = (h.health && h.health.queue) || {};
                            setBanner(true, 'Engine online · VPN ' + (vpn.connected ? 'up' : 'DOWN') + ' · Queue ' + (q.total || 0) + ' · Outbox ' + (out.waiting || 0) + ' waiting');
                            renderQueue(q);
                        } else {
                            setBanner(false, 'Engine offline · ' + (out.waiting || 0) + ' job(s) in outbox');
                        }
                        return apiGet('MediaDownloader/Outbox');
                    }).then((o) => { renderOutbox(o.items); })
                    .catch((err) => { setBanner(false, 'Plugin error: ' + errMsg(err)); });
                }

                // ====== SEARCH ======
                let searchTimer = null;
                let results = [];
                let selected = null;

                function doSearch() {
                    const q = $('#searchInput').value.trim();
                    if (q.length < 2) { hideResults(); return; }
                    const type = $('#searchType').value;
                    apiGet('MediaDownloader/Search?q=' + encodeURIComponent(q) + '&type=' + type)
                        .then((r) => { results = (r && r.results) || []; showResults(); })
                        .catch(() => { results = []; showResults(); });
                }

                function showResults() {
                    const box = $('#searchResults');
                    if (!results.length) {
                        box.style.display = 'block';
                        box.innerHTML = '<div style="padding:.5em;color:#999;">No results found.</div>';
                        return;
                    }
                    box.style.display = 'block';
                    var rows = '';
                    for (var i = 0; i < results.length; i++) {
                        var r = results[i];
                        rows += '<tr data-idx="' + i + '">';
                        rows += '<td style="font-weight:500;">' + (r.title || '') + '</td>';
                        rows += '<td style="color:#999;width:60px;">' + (r.year || '') + '</td>';
                        rows += '<td style="color:#999;width:70px;">' + (r.type === 'movie' ? 'Movie' : 'TV') + '</td>';
                        rows += '<td style="width:70px;text-align:right;"><button class="md-select-btn" type="button">Select</button></td>';
                        rows += '</tr>';
                    }
                    box.innerHTML = '<table><tbody>' + rows + '</tbody></table>';
                    var trs = box.querySelectorAll('tr[data-idx]');
                    for (var j = 0; j < trs.length; j++) {
                        (function(tr) {
                            tr.addEventListener('click', function() {
                                var idx = parseInt(tr.getAttribute('data-idx'));
                                selectResult(results[idx]);
                            });
                        })(trs[j]);
                    }
                }

                function hideResults() {
                    $('#searchResults').style.display = 'none';
                    $('#searchResults').innerHTML = '';
                    $('#selectedPanel').style.display = 'none';
                    $('#queueBtn').disabled = true;
                    $('#queueMsg').textContent = '';
                    selected = null;
                }

                function selectResult(r) {
                    selected = r;
                    hideResults(); // hide the list
                    // Show selected panel
                    const panel = $('#selectedPanel');
                    panel.style.display = 'flex';
                    $('#selTitle').textContent = r.title + (r.year ? ' (' + r.year + ')' : '');
                    $('#selMeta').textContent = r.type === 'movie' ? 'Movie' : 'TV Series / Anime';
                    const img = $('#selPoster');
                    if (r.poster) { img.src = r.poster; img.style.display = 'block'; } else { img.style.display = 'none'; }

                    if (r.type === 'movie') {
                        $('#selSeasonRow').style.display = 'none';
                        $('#queueBtn').disabled = false;
                        return;
                    }

                    // TV: show seasons immediately (no API call needed)
                    // Try TmdbInfo in background for accurate episode counts;
                    // show a sensible default right away so the UI never hangs.
                    $('#selSeasonRow').style.display = 'block';
                    // Default: 10 seasons × 24 eps (engine skips non-existent ones)
                    selected.seasons = [];
                    for (var i = 1; i <= 10; i++) selected.seasons.push({ season: i, episodes: 24 });
                    renderSeasons();
                    $('#queueBtn').disabled = false;

                    // Background: try to get accurate season/episode counts
                    apiGet('MediaDownloader/TmdbInfo?tmdb=' + r.tmdb + '&type=tv')
                        .then(function(info) {
                            if (info && info.seasons && info.seasons.length) {
                                selected.seasons = info.seasons;
                                renderSeasons();
                            }
                        })
                        .catch(function() { /* keep defaults */ });
                }

                function renderSeasons() {
                    var sel = $('#selSeason');
                    sel.innerHTML = '';
                    var allOpt = document.createElement('option');
                    allOpt.value = 'all';
                    allOpt.textContent = 'All Seasons';
                    sel.appendChild(allOpt);
                    var seasons = (selected && selected.seasons) || [];
                    seasons.forEach(function(s) {
                        var opt = document.createElement('option');
                        opt.value = s.season;
                        opt.textContent = 'Season ' + s.season + ' (' + s.episodes + ' eps)';
                        sel.appendChild(opt);
                    });
                    if (!seasons.length) {
                        var opt1 = document.createElement('option');
                        opt1.value = '1'; opt1.textContent = 'Season 1';
                        sel.appendChild(opt1);
                    }
                    updateEpisodes();
                }

                function updateEpisodes() {
                    const seasonVal = $('#selSeason').value;
                    const seasons = (selected && selected.seasons) || [];
                    const sel = $('#selEpisode');
                    if (seasonVal === 'all') {
                        // All seasons: just show "All episodes"
                        sel.innerHTML = '<option value="all">All episodes (all seasons)</option>';
                        return;
                    }
                    const season = parseInt(seasonVal) || 1;
                    const s = seasons.find((x) => x.season === season);
                    const maxEp = s ? s.episodes : 24;
                    sel.innerHTML = '<option value="all">All episodes (1–' + maxEp + ')</option>';
                    for (let i = 1; i <= Math.min(maxEp, 120); i++) {
                        const opt = document.createElement('option');
                        opt.value = String(i); opt.textContent = 'Episode ' + i;
                        sel.appendChild(opt);
                    }
                }

                // ====== QUEUE DOWNLOAD ======
                function queueDownload() {
                    if (!selected) return;
                    const library = $('#jobLibrary').value;

                    // Check if a library is available
                    const libOpts = $('#jobLibrary').options;
                    const hasLibs = libOpts.length > 1; // more than just the placeholder
                    if (!library && !hasLibs) {
                        showMsg('err', 'No library available. Set one in Media Downloader → Settings first.');
                        return;
                    }

                    const btn = $('#queueBtn');
                    btn.disabled = true;
                    showMsg('wait', 'Queuing…');

                    let jobs = [];
                    if (selected.type === 'movie') {
                        jobs.push({
                            sourceUrl: 'https://vidsrc.sh/embed/movie/' + selected.tmdb,
                            title: selected.title,
                            scope: 'episodes',
                            selections: [{ season: 1, episodes: [1] }]
                        });
                    } else {
                        const seasonVal = $('#selSeason').value;
                        const epVal = $('#selEpisode').value;
                        const seasons = (selected.seasons || []);

                        if (seasonVal === 'all') {
                            // All seasons: queue every episode in every season
                            var seasonList = seasons.length ? seasons : [{ season: 1, episodes: 24 }];
                            for (var si = 0; si < seasonList.length; si++) {
                                var s = seasonList[si];
                                var maxEp = s.episodes || 24;
                                for (var e = 1; e <= maxEp; e++) {
                                    jobs.push({
                                        sourceUrl: 'https://vidsrc.sh/embed/tv/' + selected.tmdb + '-' + s.season + '-' + e,
                                        title: selected.title + ' S' + s.season + 'E' + e,
                                        scope: 'episodes',
                                        selections: [{ season: s.season, episodes: [e] }]
                                    });
                                }
                            }
                        } else {
                            var season = parseInt(seasonVal) || 1;
                            var s2 = seasons.find(function(x) { return x.season === season; });
                            var maxEp2 = s2 ? s2.episodes : 24;
                            if (epVal === 'all') {
                                for (var e2 = 1; e2 <= maxEp2; e2++) {
                                    jobs.push({
                                        sourceUrl: 'https://vidsrc.sh/embed/tv/' + selected.tmdb + '-' + season + '-' + e2,
                                        title: selected.title + ' S' + season + 'E' + e2,
                                        scope: 'episodes',
                                        selections: [{ season: season, episodes: [e2] }]
                                    });
                                }
                            } else {
                                var ep = parseInt(epVal) || 1;
                                jobs.push({
                                    sourceUrl: 'https://vidsrc.sh/embed/tv/' + selected.tmdb + '-' + season + '-' + ep,
                                    title: selected.title + ' S' + season + 'E' + ep,
                                    scope: 'episodes',
                                    selections: [{ season: season, episodes: [ep] }]
                                });
                            }
                        }
                    }
                    if (library) jobs.forEach((j) => { j.library = library; });

                    const promises = jobs.map((j) => apiPost('MediaDownloader/Jobs', j));
                    Promise.all(promises)
                        .then((res) => {
                            const ok = res.filter((r) => r && (r.accepted || r.jobId)).length;
                            showMsg('ok', '✓ Queued ' + ok + ' job' + (ok > 1 ? 's' : '') + (library ? ' → ' + library : ''));
                            // Reset selection
                            selected = null;
                            $('#selectedPanel').style.display = 'none';
                            $('#searchInput').value = '';
                            $('#queueBtn').disabled = true;
                            refresh();
                        })
                        .catch((err) => { showMsg('err', errMsg(err)); })
                        .finally(() => { btn.disabled = false; });
                }

                function showMsg(kind, text) {
                    const el = $('#queueMsg');
                    el.textContent = text;
                    el.className = 'md-msg ' + (kind === 'ok' ? 'ok' : kind === 'err' ? 'err' : 'wait');
                }

                // ====== EVENTS ======
                $('#searchInput').addEventListener('input', () => {
                    clearTimeout(searchTimer);
                    searchTimer = setTimeout(doSearch, 350);
                });
                $('#searchInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(); }
                    if (e.key === 'Escape') hideResults();
                });
                $('#selSeason').addEventListener('change', updateEpisodes);
                $('#queueBtn').addEventListener('click', queueDownload);

                $('#refreshBtn').addEventListener('click', refresh);
                $('#pauseBtn').addEventListener('click', () => apiPost('MediaDownloader/Queue/pause').then(refresh).catch(() => {}));
                $('#resumeBtn').addEventListener('click', () => apiPost('MediaDownloader/Queue/resume').then(refresh).catch(() => {}));
                $('#stopBtn').addEventListener('click', () => apiPost('MediaDownloader/Queue/stop').then(refresh).catch(() => {}));
                $('#purgeSentBtn').addEventListener('click', () => {
                    if (!confirm('Clear all delivered jobs?')) return;
                    apiPost('MediaDownloader/Outbox/purge', { state: 'sent' }).then(refresh).catch(() => {});
                });
                $('#purgeRejectedBtn').addEventListener('click', () => {
                    if (!confirm('Clear all rejected jobs?')) return;
                    apiPost('MediaDownloader/Outbox/purge', { state: 'rejected' }).then(refresh).catch(() => {});
                });

                // ====== INIT ======
                document.querySelector('#overviewPage').addEventListener('pageshow', () => {
                    // Load libraries
                    apiGet('MediaDownloader/Libraries').then((r) => {
                        const libs = (r && r.libraries) || [];
                        const sel = $('#jobLibrary');
                        sel.innerHTML = '<option value="">Library…</option>';
                        libs.forEach((lib) => {
                            const opt = document.createElement('option');
                            opt.value = lib.name;
                            opt.textContent = lib.name + ' (' + (lib.collectionType || '') + ')';
                            sel.appendChild(opt);
                        });
                        // Show warning if no libraries
                        if (!libs.length) $('#libWarning').style.display = 'block';
                    }).catch(() => { $('#libWarning').style.display = 'block'; });
                    refresh();
                });
            })();
        </script>
    </div>
</body>
</html>
